<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ghibli Fans - Register</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
</head>
<body>
    <header class="site-header">
        <a href="{{ url_for('login') }}" aria-label="Ghibli Fans home">
            <img src="{{ url_for('static', filename='img/Studio-Ghibli-Logo.jpg') }}" alt="Studio Ghibli logo">
        </a>
    </header>
    <nav class="site-nav" aria-label="Main navigation">
        <a class="button" href="{{ url_for('login') }}">Login</a>
    </nav>
    <main class="form-card register">
        <h1>Join Ghibli Fans</h1>
        <p>Create an account to join the movie discussions.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message {{ category }}" role="status">{{ message }}</p>
            {% endfor %}
        {% endwith %}
        <form action="{{ url_for('register') }}" method="post" autocomplete="off">
            <label for="fullname">Full name</label>
            <input type="text" name="fullname" id="fullname" maxlength="64" required>

            <label for="username">Username</label>
            <input type="text" name="username" id="username" maxlength="12" pattern="[A-Za-z0-9]+" required>

            <label for="password">Password (6–12 characters)</label>
            <input type="password" name="password" id="password" minlength="6" maxlength="12" required>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" maxlength="64" required>

            <button type="submit">Register</button>
        </form>
    </main>
    <footer><p>&copy; 2026 Ghibli Fans. All rights reserved.</p></footer>
</body>
</html>
