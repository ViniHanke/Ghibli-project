<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ghibli Fans{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
</head>
<body>
    <header class="site-header">
        <a href="{% block brand_link %}{{ url_for('login') }}{% endblock %}" aria-label="Ghibli Fans home">
            <img src="{{ url_for('static', filename='img/Studio-Ghibli-Logo.jpg') }}" alt="Studio Ghibli logo">
        </a>
    </header>
    <nav class="site-nav" aria-label="Main navigation">
        {% block navigation %}{% endblock %}
    </nav>
    {% block content %}{% endblock %}
    <footer><p>&copy; 2026 Ghibli Fans. All rights reserved.</p></footer>
</body>
</html>
