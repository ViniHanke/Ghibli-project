<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ghibli Fans - Login</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
</head>
<body>
    <header class="site-header">
        <a href="{{ url_for('login') }}" aria-label="Ghibli Fans home">
            <img src="{{ url_for('static', filename='img/Studio-Ghibli-Logo.jpg') }}" alt="Studio Ghibli logo">
        </a>
    </header>
    <nav class="site-nav" aria-label="Main navigation">
        <a class="button" href="{{ url_for('register') }}">Register</a>
    </nav>
    <main class="form-card login">
        <h1>Ghibli Fans Login</h1>
        <p>Log in to read and join discussions about Studio Ghibli films.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message {{ category }}" role="status">{{ message }}</p>
            {% endfor %}
        {% endwith %}
        <form action="{{ url_for('login') }}" method="post">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" autocomplete="username" required>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" autocomplete="current-password" required>
            <button type="submit">Log in</button>
        </form>
    </main>
    <footer><p>&copy; 2026 Ghibli Fans. All rights reserved.</p></footer>
</body>
</html>
